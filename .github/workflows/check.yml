name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-macos-system-python:
    runs-on: macos-latest  # the stock macOS python3 (3.9.x) is the real-world floor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 agent_skills.py check
      - run: /usr/bin/python3 -m unittest -v

  test-current-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agent_skills.py check
      - run: python -m unittest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
