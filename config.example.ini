; Copy to config.ini (gitignored) and edit for this machine.
; Paths use ~; nothing machine-specific belongs in the repo.

[defaults]
mode = link            ; link: edits in the repo are live | copy: reinstall to update

; Personal machine: user-scoped Claude skills, linked.
[target:claude]
skills_dir = ~/.claude/skills
working_style = ~/.claude/working-style.md
skills = *             ; * for all, or a comma list

; Example for a machine whose other agents read ~/.agents/skills, copied.
; [target:agents]
; skills_dir = ~/.agents/skills
; mode = copy
; skills = pr-learning, docs-drift
